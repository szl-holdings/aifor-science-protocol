version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # pip is omitted on purpose. This repository is a specification (Markdown,
  # JSON Schema, CITATION.cff) with no Python package manifest. A pip entry
  # makes the Dependabot updater fail with dependency_file_not_found
  # (see Dependabot run 42129529664 / #1684153590).
