version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # requirements-test.txt and requirements-citation.txt pin the validators CI
  # runs (pytest suite and cffconvert). The earlier pip entry failed with
  # dependency_file_not_found (Dependabot run 42129500386 / #1684153590)
  # because no pip manifest existed then; these two files are that manifest.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
