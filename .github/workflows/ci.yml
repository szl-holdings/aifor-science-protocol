name: CI

# This repository is a protocol specification: PROTOCOL.md, a JSON Schema
# (protocol.schema.json) and a CITATION.cff. The checks below prove that the
# schema is a valid JSON Schema 2020-12 document, that PROTOCOL.md, the schema,
# README.md and CITATION.cff agree with each other (tests/), and that
# CITATION.cff passes the strict CFF validator. They prove nothing about any
# experiment: none exists in this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r requirements-test.txt

      - name: Validate protocol.schema.json against JSON Schema 2020-12
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open("protocol.schema.json", encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          print("protocol.schema.json: valid", schema.get("$schema"), "title=", schema.get("title"), "version=", schema.get("version"))
          PY

      - name: Run the protocol consistency tests
        run: python -m pytest -v -p no:cacheprovider

      # A parse-only check accepted `cff-version: 1.6.0`, which is not a CFF
      # version. cffconvert validates against the official CFF schema. It
      # needs jsonschema<4, so it gets its own virtualenv.
      - name: Validate CITATION.cff (cffconvert, strict CFF schema)
        run: |
          python -m venv "$RUNNER_TEMP/cffconvert"
          "$RUNNER_TEMP/cffconvert/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir -r requirements-citation.txt
          "$RUNNER_TEMP/cffconvert/bin/cffconvert" --validate -i CITATION.cff
